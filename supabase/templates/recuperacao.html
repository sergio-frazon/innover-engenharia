<h2>Criar uma nova senha</h2>
<p>Recebemos um pedido para trocar a senha do seu acesso ao sistema de Gestão de Obras.</p>
<p>
  <a href="{{ .SiteURL }}/auth/verificar?token_hash={{ .TokenHash }}&type=recovery"
     style="display:inline-block;padding:10px 18px;background:#1d4ed8;color:#ffffff;text-decoration:none;border-radius:6px">
    Criar nova senha
  </a>
</p>
<p style="color:#64748b;font-size:13px">
  O link vale por 24 horas e só pode ser usado uma vez. Se você não pediu a troca, ignore este e-mail: sua senha continua a mesma.
</p>
